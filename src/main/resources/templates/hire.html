<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>직원 고용 | Company</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar">
    <!-- 메인 화면으로 돌아가기 -->
    <a class="btn btn-ghost" th:href="@{/}">← 메인으로</a>
    <span class="lob-chip"><span class="lob-label">LOB</span> <strong id="lobValue">-</strong></span>
</header>

<main class="container">
    <section class="panel">
        <div class="panel-head">
            <h2>신규 직원 고용</h2>
            <p>준비 2단계 · 원하는 만큼 고용한 뒤 <strong>준비 완료 · 업무 시작</strong>을 누르세요. 스탯 1단계는 무료이며, 한 단계 올릴 때마다 <strong>5 LOB</strong>이 듭니다.</p>
        </div>

        <label class="field">
            <span>직원 이름</span>
            <input type="text" id="workerName" maxlength="20" placeholder="최대 20자">
        </label>

        <!-- 스탯 행은 hire.js가 STATS 배열을 보고 그려줌 -->
        <div class="stats" id="statRows"></div>

        <div class="summary">
            <div><span>소모 LOB</span><strong id="costValue">0</strong></div>
            <div><span>고용 후 잔액</span><strong id="afterValue">-</strong></div>
            <div><span>예상 체력 / 정신력</span><strong id="previewHpMind">-</strong></div>
        </div>

        <div class="alert" id="hireError" hidden></div>
        <div class="notice" id="hireOk" hidden></div>

        <div class="actions">
            <button class="btn btn-ghost" id="resetBtn" type="button">초기화</button>
            <button class="btn btn-primary" id="hireBtn" type="button">고용하기</button>
        </div>
    </section>

    <!-- ===== 보유 직원 목록 (고용 화면 아래에 항상 표시) ===== -->
    <section class="panel">
        <div class="panel-head">
            <h2>보유 직원 <span class="count" id="workerCount">0</span></h2>
            <p>최근에 고용한 순서로 보여줍니다.</p>
        </div>
        <!-- 목록을 불러오다 실패하면 여기에 서버 오류 내용이 표시됨 -->
        <div class="alert" id="rosterError" hidden></div>
        <div class="empty" id="emptyRoster" hidden>아직 고용한 직원이 없습니다.</div>
        <div class="roster" id="roster"></div>
    </section>

    <!-- ===== 준비 끝 → 업무 단계로 (업무 단계부터는 고용 불가) ===== -->
    <section class="panel">
        <div class="panel-head">
            <h2>준비 완료</h2>
            <p>업무를 시작하면 오늘은 더 이상 직원을 고용할 수 없습니다.</p>
        </div>
        <div class="alert" id="operateError" hidden></div>
        <div class="actions">
            <button class="btn btn-primary" id="operateBtn" type="button">준비 완료 · 업무 시작</button>
        </div>
    </section>
</main>

<script th:src="@{/js/hire.js}"></script>
</body>
</html>
